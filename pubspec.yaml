name: mi_app_verificadora
description: App de verificación de identidad con biometría y OCR.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State management / DI ───────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Biometría ───────────────────────────────────────────────────
  local_auth: ^2.3.0

  # ── OCR ─────────────────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.13.0

  # ── Media ───────────────────────────────────────────────────────
  image_picker: ^1.0.7
  file_picker: ^8.0.0

  # ── PDF ─────────────────────────────────────────────────────────
  pdfx: ^2.6.0

  # ── Utils ───────────────────────────────────────────────────────
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true